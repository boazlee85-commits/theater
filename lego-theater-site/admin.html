<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Theater Editor</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin{max-width:900px; margin:1.5rem auto; padding:0 1rem}
    .panel{background:#fff; border-radius:14px; padding:1.25rem; margin-bottom:1.25rem; box-shadow:0 6px 0 rgba(0,0,0,.15)}
    .panel h2{display:flex; justify-content:space-between; align-items:center; gap:.5rem}
    .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.75rem}
    .f{display:grid; gap:.2rem; margin-bottom:.5rem}
    .f label{font-size:.8rem; font-weight:bold; text-transform:uppercase; letter-spacing:.4px; color:#555}
    .f input,.f select,.f textarea{padding:.5rem; border:3px solid var(--dark); border-radius:8px; font:inherit; width:100%}
    .f input[type=color]{padding:0; height:42px}
    .item{border:3px dashed #0003; border-radius:12px; padding:1rem; margin-bottom:1rem}
    .item-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem; font-weight:900}
    .sticky{position:sticky; bottom:0; background:var(--dark); padding:.8rem; display:flex; gap:.6rem; flex-wrap:wrap; justify-content:center; z-index:10}
    .tip{background:var(--yellow); border-radius:10px; padding:.8rem; font-weight:bold}
  </style>
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="brand"><span class="logo-brick">🧱</span><span>Theater Editor</span></a>
    <nav><a href="index.html">← Back to site</a></nav>
  </header>

  <div class="admin">
    <div class="tip">How it works: change things below, click <em>Download config.js</em>, and replace the <code>config.js</code> file in your site folder. Then re-publish (see README). This page doesn't change the live site by itself.</div>
    <div id="app" style="margin-top:1.25rem"></div>
  </div>

  <div class="sticky">
    <button class="btn yellow" id="dl">⬇ Download config.js</button>
    <button class="btn blue" id="copy">📋 Copy config</button>
    <label class="btn ghost" style="margin:0">⬆ Load config.js<input id="load" type="file" accept=".js,.json" hidden></label>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
